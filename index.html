<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="A romantic marriage proposal website filled with love, memories, and beautiful moments.">
  <title>Ashu — Proposal</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="site-header" role="banner">
    <div class="container">
      <div class="brand"><div class="logo">A</div><h1 style="margin:0;font-size:16px">Ashu</h1></div>
      <nav class="site-nav" role="navigation" aria-label="Main">
        <a href="index.html">Home</a>
        <a href="photo.html">Photos</a>
        <a href="wife.html">Wife</a>
        <a href="celebration.html">Celebrate</a>
        <a class="btn ghost" href="secret.html">🔒 Secret</a>
      </nav>
    </div>
  </header>

  <div class="floating-hearts">
    <div class="heart" style="left:10%; animation-delay:0s;">💖</div>
    <div class="heart" style="left:20%; animation-delay:1s;">💕</div>
    <div class="heart" style="left:30%; animation-delay:2s;">💓</div>
    <div class="heart" style="left:40%; animation-delay:3s;">💘</div>
    <div class="heart" style="left:50%; animation-delay:4s;">💗</div>
    <div class="heart" style="left:60%; animation-delay:5s;">💞</div>
    <div class="heart" style="left:70%; animation-delay:6s;">💝</div>
    <div class="heart" style="left:80%; animation-delay:7s;">💟</div>
    <div class="heart" style="left:90%; animation-delay:8s;">❤️</div>
  </div>

  <main class="container" style="padding-top:28px;">
    <section class="hero" aria-labelledby="proposal-heading">
      <h1 id="proposal-heading">Will You Marry Me?</h1>
      <p class="hero-sub">You are the sunshine of my life. Every moment with you is a memory I cherish.</p>
      <p class="hero-sub">In your eyes, I found my home, my love, my forever. 💕</p>
      <div style="margin-top:18px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <button class="btn" id="yesBtn">Yes — 💍</button>
        <button class="btn ghost" id="noBtn">No — 🙈</button>
        <a class="btn" href="reasons.html">Reasons</a>
      </div>
      <div class="confetti" id="confetti" aria-hidden="true"></div>


    </section>
  </main>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const confetti = document.getElementById("confetti");

    noBtn.addEventListener("mouseover", () => {
      const x = Math.random() * (window.innerWidth - 500);
      const y = Math.random() * (window.innerHeight - 300);
      noBtn.style.position = "absolute";
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
    });

    yesBtn.addEventListener("click", () => {
      launchConfetti();
      setTimeout(() => {
        window.location.href = "celebration.html";
      }, 2000);
    });

    function launchConfetti() {
      for (let i = 0; i < 150; i++) {
        const confetto = document.createElement("div");
        confetto.style.position = "absolute";
        confetto.style.width = "10px";
        confetto.style.height = "10px";
        confetto.style.background = getRandomColor();
        confetto.style.left = `${Math.random() * window.innerWidth}px`;
        confetto.style.top = `${Math.random() * window.innerHeight}px`;
        confetto.style.opacity = "0.8";
        confetto.style.animation = "fall 3s ease-out forwards";
        confetti.appendChild(confetto);
        setTimeout(() => confetti.removeChild(confetto), 3000);
      }
    }

    function getRandomColor() {
      const colors = ["#f44336", "#e91e63", "#9c27b0", "#ff9800", "#4caf50", "#03a9f4"];
      return colors[Math.floor(Math.random() * colors.length)];
    }
  </script>
  <footer class="site-footer">
    <div class="container"><small>Made with 💖 by Ayu for eternal love</small></div>
  </footer>
</body>
</html>

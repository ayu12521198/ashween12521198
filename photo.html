<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Beautiful photo gallery showcasing our cherished memories and moments together.">
  <title>Photos</title>
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    body{font-family: 'Roboto', sans-serif;margin:0;background: linear-gradient(135deg, #ffe6f0 0%, #ffb3d9 50%, #ff80ab 100%);color: #3e2723;}
    .wrap{max-width:1200px;margin:24px auto;padding:18px}
    h1{color:#c2185b;text-align:center; font-family: 'Dancing Script', cursive; font-size: 32px;}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:18px}
    .tile{position:relative;background: rgba(255, 255, 255, 0.95);border-radius:15px;overflow:hidden;box-shadow:0 6px 18px rgba(255,20,147,0.2);display:flex;align-items:center;justify-content:center; backdrop-filter: blur(10px);}
    .tile img,.tile video{width:100%;min-height:200px;height:auto;object-fit:contain;display:block; border-radius: 10px;}
    .play-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
    .play-overlay button{background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.12);color:#fff;padding:8px 10px;border-radius:6px;pointer-events:auto;cursor:pointer}
    .select-btn{position:absolute;top:8px;left:8px;background:rgba(255,255,255,0.95);border:none;padding:6px;border-radius:50%;cursor:pointer;box-shadow:0 6px 18px rgba(150,50,100,0.08);font-size:16px}
    .tile.selected{outline:3px solid rgba(255,70,120,0.3);box-shadow:0 10px 30px rgba(210,70,120,0.2)}
    .capsule-modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg, rgba(255,240,250,0.9), rgba(255,250,255,0.6));z-index:2000;opacity:0;pointer-events:none;transition:opacity .18s ease}
    .capsule-modal.open{opacity:1;pointer-events:auto}
    .capsule-card{background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);padding:18px;border-radius:20px;max-width:640px;box-shadow:0 12px 40px rgba(200,80,120,0.2);text-align:center}
    .capsule-card h2{margin:0;color:#c2185b;font-size:24px; font-family: 'Dancing Script', cursive;}
    .capsule-card .muted{color:#d81b60;font-size:13px}
    .controls{display:flex;justify-content:center;gap:12px;margin-top:14px}
    .btn{padding:10px 14px;border-radius:25px;border:none;background: linear-gradient(90deg,#e91e63,#f06292);color:#fff;cursor:pointer; font-weight: 500; transition: all 0.3s ease;}
    .btn:hover { transform: translateY(-2px); }
    .back{display:inline-block;margin-top:12px;color:#e91e63;text-decoration:none; font-weight: 500;}
    /* lightbox styles */
    .lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:10000;opacity:0;pointer-events:none;transition:opacity .2s;overflow:auto}
    .lightbox.open{opacity:1;pointer-events:auto}
    .lightbox img{border-radius:15px;box-shadow:0 8px 40px rgba(0,0,0,0.6); border: 5px solid rgba(255,255,255,0.8);}
    .lightbox .lbMedia img,.lightbox .lbMedia video{border-radius:15px;box-shadow:0 8px 40px rgba(0,0,0,0.6);display:block}
    .lightbox .close,.lightbox .prev,.lightbox .next{position:fixed;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:#fff;padding:8px 12px;border-radius:6px;cursor:pointer}
    .lightbox .close{top:20px;right:20px}
    .lightbox .prev{left:20px;top:50%;transform:translateY(-50%)}
    .lightbox .next{right:20px;top:50%;transform:translateY(-50%)}
    .lightbox .meta{position:fixed;bottom:20px;color:#fff;font-size:14px}
  </style>
</head>
<body>
  <header class="site-header" role="banner">
    <div class="container">
      <div class="brand"><div class="logo">A</div><h1 style="margin:0;font-size:16px">Ashu</h1></div>
      <nav class="site-nav" role="navigation" aria-label="Main">
        <a href="index.html">Home</a>
        <a href="photo.html">Photos</a>
        <a href="wife.html">Wife</a>
      </nav>
    </div>
  </header>

  <div class="floating-hearts">
    <div class="heart" style="left:10%; animation-delay:0s;">💖</div>
    <div class="heart" style="left:20%; animation-delay:1s;">💕</div>
    <div class="heart" style="left:30%; animation-delay:2s;">💓</div>
    <div class="heart" style="left:40%; animation-delay:3s;">💘</div>
    <div class="heart" style="left:50%; animation-delay:4s;">💗</div>
    <div class="heart" style="left:60%; animation-delay:5s;">💞</div>
    <div class="heart" style="left:70%; animation-delay:6s;">💝</div>
    <div class="heart" style="left:80%; animation-delay:7s;">💟</div>
    <div class="heart" style="left:90%; animation-delay:8s;">❤️</div>
  </div>

  <div class="wrap">
    <h1>Photo Gallery</h1>
    <div class="controls">
      <button id="loadBtn" class="btn">Load Photos</button>
      <button id="openCapsuleBtn" class="btn love">Love Capsule</button>
      <button id="loadAllBtn" class="btn ghost">Load All Photos & Videos</button>
      <a class="back" href="index.html">← Back to Home</a>
    </div>

    <div id="grid" class="grid" aria-live="polite" aria-label="Photo and video gallery"></div>
    <div id="galleryStatus" style="display:none;text-align:center;color:var(--muted);margin-top:8px;font-size:14px"></div>

    <!-- Love Capsule modal -->
    <div id="capsuleModal" class="capsule-modal" role="dialog" aria-modal="true" style="display:none">
      <div class="capsule-card" role="document">
        <h2>Love Capsule</h2>
        <p class="muted">Select photos (click the ♡) and write a short message. Download the capsule (JSON) to send or save.</p>
        <textarea id="capsuleMsg" rows="3" placeholder="Write your message..." style="width:100%;margin-top:8px;border-radius:8px;padding:8px">तुम्हारी हर बात मेरे दिन को सुनहरा कर देती है — मैं तुमसे बेहद प्यार करता हूँ।</textarea>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
          <div><small id="selectedCount">0 selected</small></div>
          <div style="display:flex;gap:8px">
            <button id="selectAllBtn" class="btn ghost">Select All</button>
            <button id="downloadCapsuleBtn" class="btn love">Download Capsule</button>
            <button id="closeCapsuleBtn" class="btn ghost">Close</button>
          </div>
        </div>
      </div>
    </div>

    <!-- lightbox -->
    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" style="display:none">
      <button class="close" id="lbClose">✕</button>
      <button class="prev" id="lbPrev">◀</button>
      <div id="lbMedia" class="lbMedia" role="region" aria-label="Media viewer"></div>
      <button class="next" id="lbNext">▶</button>
      <div class="meta" id="lbMeta"></div>
    </div>
  </div>

  <script>
  // build a gallery that supports images and videos (jpg/jpeg/png/mp4/webm)
  const grid = document.getElementById('grid');
  const loadBtn = document.getElementById('loadBtn');
  const loadAllBtn = document.getElementById('loadAllBtn');
  const lightbox = document.getElementById('lightbox');
  const lbMedia = document.getElementById('lbMedia');
  const lbClose = document.getElementById('lbClose');
  const lbPrev = document.getElementById('lbPrev');
  const lbNext = document.getElementById('lbNext');
  const lbMeta = document.getElementById('lbMeta');
  const galleryStatus = document.getElementById('galleryStatus');

  const pageBase = new URL('.', window.location.href);

  let mediaList = []; // {src,type,name}
  let currentIndex = -1;

  function makeTile(item, idx){
    const div = document.createElement('div'); div.className='tile';
    if(item.type === 'image'){
      const img = document.createElement('img'); img.src = item.src; img.alt = item.name; img.dataset.index = idx; img.loading='lazy'; div.appendChild(img);
      const sel = document.createElement('button'); sel.className='select-btn'; sel.title='Select photo'; sel.innerHTML='♡'; sel.addEventListener('click',(e)=>{ e.stopPropagation(); toggleSelect(idx); });
      div.appendChild(sel);
    }else{
      const vid = document.createElement('video'); vid.src = item.src; vid.dataset.index = idx; vid.preload='metadata'; vid.muted=true; vid.playsInline=true; div.appendChild(vid);
      const overlay = document.createElement('div'); overlay.className='play-overlay'; overlay.innerHTML = `<button aria-label="Play video">▶</button>`;
      overlay.querySelector('button').addEventListener('click',(e)=>{ e.stopPropagation(); openLightbox(idx); });
      div.appendChild(overlay);
    }
    div.dataset.index = idx;
    return div;
  }

  async function checkImage(src){
    return await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(true); im.onerror=()=>rej(false); im.src=src; });
  }
  async function checkVideo(src){
    return await new Promise((res,rej)=>{ const v=document.createElement('video'); v.onloadedmetadata=()=>res(true); v.onerror=()=>rej(false); v.src=src; });
  }

  // selection and capsule helpers
  let selectedSet = new Set();
  function toggleSelect(idx){
    const tile = document.querySelector(`.tile[data-index="${idx}"]`);
    if(selectedSet.has(idx)){
      selectedSet.delete(idx); if(tile) tile.classList.remove('selected');
    }else{
      selectedSet.add(idx); if(tile) tile.classList.add('selected');
    }
    updateSelectedCount();
  }
  function updateSelectedCount(){
    const el = document.getElementById('selectedCount'); if(!el) return; el.textContent = `${selectedSet.size} selected`;
  }
  function openCapsuleModal(){
    const m = document.getElementById('capsuleModal'); if(!m) return; m.style.display='flex'; setTimeout(()=>m.classList.add('open'),20); updateSelectedCount();
  }
  function closeCapsuleModal(){
    const m = document.getElementById('capsuleModal'); if(!m) return; m.classList.remove('open'); setTimeout(()=>m.style.display='none',220);
  }
  function selectAll(){
    // select all image tiles currently displayed
    document.querySelectorAll('.tile').forEach((t,i)=>{
      const idx = Number(t.dataset.index);
      const isImage = (mediaList[idx] && mediaList[idx].type === 'image');
      if(isImage){ selectedSet.add(idx); t.classList.add('selected'); }
    });
    updateSelectedCount();
  }
  function downloadCapsule(){
    const msg = document.getElementById('capsuleMsg')?.value || '';
    const items = Array.from(selectedSet).map(i => mediaList[i]?.src).filter(Boolean);
    if(items.length===0){ alert('Please select at least one photo to include in the capsule.'); return; }
    const capsule = { message: msg, items, created: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(capsule, null, 2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `love-capsule-${new Date().toISOString().slice(0,10)}.json`; document.body.appendChild(a); a.click(); a.remove();
  }

  // fetch a manifest with all media files and populate the grid
  async function fetchManifest(){
    try{
      const manifestUrl = new URL('ashween/media.json', pageBase).href;
      const res = await fetch(manifestUrl);
      if (!res.ok) throw new Error(`HTTP ${res.status} while fetching manifest`);
      const list = await res.json(); // [{name,type}]
      mediaList = list.map(f => ({ src: new URL(`ashween/${f.name}`, pageBase).href, type: f.type, name: f.name }));
      return mediaList;
    }catch(err){
      console.error('Could not load media manifest', err);
      galleryStatus.style.display = 'block';
      galleryStatus.textContent = 'Failed to load media manifest. Check that ashween/media.json exists and the site is served from GitHub Pages, not raw GitHub preview.';
      mediaList = [];
      return [];
    }
  }

  async function loadImages(){
    loadBtn.disabled = true; loadBtn.textContent = 'Loading...';
    grid.innerHTML = '';
    await fetchManifest();
    const images = mediaList.filter(m => m.type === 'image');
    mediaList = images;
    images.forEach((it, i) => grid.appendChild(makeTile(it, i)));
    loadBtn.textContent = 'Reload Photos'; loadBtn.disabled = false;
    galleryStatus.style.display = 'block';
    galleryStatus.textContent = `${mediaList.length} photos loaded`;
  }

  async function loadAllMedia(){
    loadAllBtn.disabled = true; loadAllBtn.textContent = 'Searching...';
    grid.innerHTML = '';
    await fetchManifest();
    mediaList.forEach((it, i) => grid.appendChild(makeTile(it, i)));
    loadAllBtn.textContent = 'Reload All Media'; loadAllBtn.disabled = false;
    galleryStatus.style.display = 'block';
    galleryStatus.textContent = `${mediaList.length} items loaded`;
  }

  loadBtn.addEventListener('click', loadImages);
  const openCapsuleBtn = document.getElementById('openCapsuleBtn');
  const closeCapsuleBtn = document.getElementById('closeCapsuleBtn');
  const downloadCapsuleBtn = document.getElementById('downloadCapsuleBtn');
  const selectAllBtn = document.getElementById('selectAllBtn');
  if(openCapsuleBtn) openCapsuleBtn.addEventListener('click', openCapsuleModal);
  if(closeCapsuleBtn) closeCapsuleBtn.addEventListener('click', closeCapsuleModal);
  if(downloadCapsuleBtn) downloadCapsuleBtn.addEventListener('click', downloadCapsule);
  if(selectAllBtn) selectAllBtn.addEventListener('click', selectAll);
  loadAllBtn.addEventListener('click', loadAllMedia);

  // auto-load all media on page open
  loadAllMedia();

  // Thumbnail click -> open lightbox
  grid.addEventListener('click', (e)=>{
    const tile = e.target.closest('.tile');
    if (!tile) return;
    const idx = Number(tile.dataset.index);
    if (Number.isFinite(idx)) openLightbox(idx);
  });

  function openLightbox(idx){
    currentIndex = idx;
    const item = mediaList[currentIndex];
    lbMedia.innerHTML = '';
    if(item.type === 'image'){
      const img = document.createElement('img'); img.src = item.src; img.alt = item.name; lbMedia.appendChild(img);
    }else{
      const v = document.createElement('video'); v.src = item.src; v.controls = true; v.autoplay = true; lbMedia.appendChild(v);
    }
    lbMeta.textContent = `${currentIndex+1} / ${mediaList.length} (${item.type})`;
    lightbox.classList.add('open'); lightbox.style.display = 'flex'; document.body.style.overflow = 'hidden';
  }

  function closeLightbox(){
    lightbox.classList.remove('open');
    setTimeout(()=>{ lightbox.style.display = 'none'; lbMedia.innerHTML = ''; }, 200);
    document.body.style.overflow = '';
  }

  function showNext(){ if (mediaList.length===0) return; currentIndex = (currentIndex+1) % mediaList.length; openLightbox(currentIndex); }
  function showPrev(){ if (mediaList.length===0) return; currentIndex = (currentIndex-1 + mediaList.length) % mediaList.length; openLightbox(currentIndex); }

  lbClose.addEventListener('click', closeLightbox);
  lbNext.addEventListener('click', (e)=>{ e.stopPropagation(); showNext(); });
  lbPrev.addEventListener('click', (e)=>{ e.stopPropagation(); showPrev(); });

  // keyboard navigation
  document.addEventListener('keydown', (e)=>{
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowRight') showNext();
    if (e.key === 'ArrowLeft') showPrev();
  });
  </script>
  <footer class="site-footer">
    <div class="container"><small>Made by Ayu</small></div>
  </footer>
</body>
</html>
